services:
  db:
    image: postgres:16-alpine
    container_name: campus-food-db
    environment:
      POSTGRES_DB: fooddb
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d fooddb"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: campus-food-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fooddb
      SPRING_DATASOURCE_USERNAME: food
      SPRING_DATASOURCE_PASSWORD: food123
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
