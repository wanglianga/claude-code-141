server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campus-food-procurement-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fooddb}
    username: ${SPRING_DATASOURCE_USERNAME:food}
    password: ${SPRING_DATASOURCE_PASSWORD:food123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

app:
  seed-demo-data: true
