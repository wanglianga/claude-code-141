spring:
  application:
    name: canteen-procurement
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus_food}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # 生产环境务必通过环境变量覆盖
    secret: ${JWT_SECRET:canteen-procurement-dev-secret-key-please-override-0123456789abcdef}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: info
