spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  seed:
    enabled: true
  jwt:
    secret: test-secret-key-for-integration-tests-0123456789abcdef
    expire-minutes: 120

logging:
  level:
    root: warn
